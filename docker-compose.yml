name: topappliances

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${DB_PREFIX:-wp_}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_HOME', '${WP_URL}');
        define('WP_SITEURL', '${WP_URL}');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_POST_REVISIONS', 10);
        define('AUTOSAVE_INTERVAL', 120);
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/top-appliance:/var/www/html/wp-content/themes/top-appliance
      - ./wp-content/plugins/top-appliance-core:/var/www/html/wp-content/plugins/top-appliance-core
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-top.ini:ro
      - ./docker/apache-cache.conf:/etc/apache2/conf-enabled/zz-cache.conf:ro

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${DB_PREFIX:-wp_}
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WP_CLI_CONFIG_PATH: /project/bin/wp-cli.yml
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/top-appliance:/var/www/html/wp-content/themes/top-appliance
      - ./wp-content/plugins/top-appliance-core:/var/www/html/wp-content/plugins/top-appliance-core
      - ./bin:/project/bin:ro
      - ./seed:/project/seed:ro
      - ./backups:/project/backups
    entrypoint: ["wp"]
    command: ["--info"]
    profiles: ["cli"]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8027}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
  wp_core:
